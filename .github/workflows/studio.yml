name: Studio validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:studio
      - run: npm run test:analytics
      - run: npm run test:seo
      - run: npm run test:components
      - run: npm run test:design-resources
      - run: node --test tests/hosted-registry.test.mjs
      - run: npm run test:archive
      - run: npm run test:wiki
      - run: npm run build
      - run: npm run verify:alpha
