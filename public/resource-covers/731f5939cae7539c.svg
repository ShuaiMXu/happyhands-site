<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"><rect width="800" height="500" fill="#fafafa"/><text x="40" y="58" font-family="Arial,sans-serif" font-size="18" fill="#666">mobbin-archive</text><text x="40" y="115" font-family="Arial,sans-serif" font-size="25" fill="#111">Mobbin</text><text x="40" y="158" font-family="Arial,sans-serif" font-size="18" fill="#666">&gt; Mobbin is a searchable design-reference library of real mobile </text><text x="40" y="201" font-family="Arial,sans-serif" font-size="18" fill="#666">When to use Mobbin</text><text x="40" y="244" font-family="Arial,sans-serif" font-size="18" fill="#666">Use Mobbin when an agent needs to:</text><text x="40" y="287" font-family="Arial,sans-serif" font-size="18" fill="#666">- Find real examples of screens, UI patterns, product flows, or w</text><text x="40" y="330" font-family="Arial,sans-serif" font-size="18" fill="#666">- Compare how shipped products solve the same design problem.</text><text x="40" y="373" font-family="Arial,sans-serif" font-size="18" fill="#666">- Ground an interface critique or design recommendation in visual</text></svg>