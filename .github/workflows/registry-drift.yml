name: Upstream registry drift
on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * 1'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-registry-drift.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registry-drift-report
          path: registry-drift-report.json
