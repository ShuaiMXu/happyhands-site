<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"><rect width="800" height="500" fill="#fafafa"/><text x="40" y="58" font-family="Arial,sans-serif" font-size="18" fill="#666">platform-systems</text><text x="40" y="115" font-family="Arial,sans-serif" font-size="25" fill="#111">Material 3 设计系统（可调用版）</text><text x="40" y="158" font-family="Arial,sans-serif" font-size="18" fill="#666">&gt; Google Material Design 3 的 token 与规则，供 agent 在生成 Android / Comp</text><text x="40" y="201" font-family="Arial,sans-serif" font-size="18" fill="#666">调用方式</text><text x="40" y="244" font-family="Arial,sans-serif" font-size="18" fill="#666">```bash</text><text x="40" y="287" font-family="Arial,sans-serif" font-size="18" fill="#666">agent 读这份 + tokens.json 即可生成符合 M3 的界面</text><text x="40" y="330" font-family="Arial,sans-serif" font-size="18" fill="#666">cat platform-systems/material3/DESIGN.md</text><text x="40" y="373" font-family="Arial,sans-serif" font-size="18" fill="#666">cat platform-systems/material3/tokens.json | jq &apos;.[&quot;--md-sys-colo</text></svg>