<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"><rect width="800" height="500" fill="#fafafa"/><text x="40" y="58" font-family="Arial,sans-serif" font-size="18" fill="#666">platform-systems</text><text x="40" y="115" font-family="Arial,sans-serif" font-size="25" fill="#111">Apple Human Interface Guidelines（可调用版）</text><text x="40" y="158" font-family="Arial,sans-serif" font-size="18" fill="#666">&gt; Apple HIG 全量 173 篇的 markdown 版，按平台/基础/组件/模式组织。</text><text x="40" y="201" font-family="Arial,sans-serif" font-size="18" fill="#666">调用方式</text><text x="40" y="244" font-family="Arial,sans-serif" font-size="18" fill="#666">```bash</text><text x="40" y="287" font-family="Arial,sans-serif" font-size="18" fill="#666">查某个主题</text><text x="40" y="330" font-family="Arial,sans-serif" font-size="18" fill="#666">grep -ril &quot;tab bar&quot; platform-systems/apple-hig/docs | head</text><text x="40" y="373" font-family="Arial,sans-serif" font-size="18" fill="#666">直接读</text></svg>