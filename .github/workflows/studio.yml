name: Studio validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:studio
      - run: npm run test:analytics
      - run: npm run test:seo
      - run: npm run test:components
      - run: npm run test:design-resources
      - run: node --test tests/hosted-registry.test.mjs
      - run: npm run test:collections
      - run: npm run test:resources:directory
      - run: npm run test:resources:specimens
      - run: npm run test:resources:search
      - run: npm run test:portal
      - run: node --import tsx --test tests/studio-retirement.test.mjs tests/header-material.test.mjs
      - run: npm run check:component-lineage
      - run: npm run test:archive
      - run: npm run test:wiki
      - run: npm run build
      - run: npm run verify:alpha
      - run: npx playwright-core install --with-deps chromium
      - name: Replay Design.md component states
        run: |
          npm run preview -- --port 4173 --strictPort &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/apps/portal/ > /dev/null; then break; fi
            sleep 1
          done
          BROWSER_PATH="$(node -p "require('playwright-core').chromium.executablePath()")" npm run test:design-md:publish:browser
